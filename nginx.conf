server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: send unknown paths to index.html so client-side routes survive a refresh
  location / {
    try_files $uri /index.html;
  }

  # Hashed build assets can be cached for a long time
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
